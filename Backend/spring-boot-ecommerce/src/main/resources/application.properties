spring.config.import=optional:application-secret.properties

spring.application.name=${APP_NAME}

spring.datasource.driver-class-name=${DB_DRIVER}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL}

spring.data.rest.base-path=${REST_BASE_PATH}

allowed.origins=${ALLOWED_ORIGINS}

spring.data.rest.detection-strategy=${DETECTION_STRATEGY}

auth0.domain=${AUTH0_DOMAIN}
auth0.client-id=${AUTH0_CLIENT_ID}
auth0.audience=${AUTH0_AUDIENCE}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/

#####
#
# HTTPS configuration
#
#####

server.port=${SERVER_PORT}

server.ssl.enabled=${SERVER_SSL_ENABLED}

server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS}

server.ssl.key-store=${SERVER_SSL_KEY_STORE}

server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD}

server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE}